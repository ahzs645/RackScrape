services:
  # API service (Node.js with Playwright)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rackscrape-api
    restart: unless-stopped

    environment:
      NODE_ENV: production
      HEADLESS: "true"
      DATABASE_PATH: /app/database/prices.db
      SCRAPE_SCHEDULE: "30 3 * * *"  # 3:30 AM daily
      TIMEZONE: America/New_York
      MAX_RETRIES: 3
      TIMEOUT_SECONDS: 60
      LOG_LEVEL: info
      RUN_ON_STARTUP: "false"
      PORT: 3000

    volumes:
      - ./database:/app/database
      - ./storage:/app/storage
      - ./exports:/app/exports
      - ./logs:/app/logs

    expose:
      - "3000"

    networks:
      - rackscrape

    # Resource limits
    mem_limit: 2G
    memswap_limit: 2G

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy (serves static files + proxies API)
  nginx:
    image: nginx:alpine
    container_name: rackscrape-nginx
    restart: unless-stopped
    ports:
      - "3030:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - rackscrape
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Separate service for one-time scrape
  rackscrape-once:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rackscrape-once
    profiles: ["manual"]  # Only run when explicitly specified

    environment:
      NODE_ENV: production
      HEADLESS: "true"
      DATABASE_PATH: /app/database/prices.db

    volumes:
      - ./database:/app/database
      - ./storage:/app/storage
      - ./exports:/app/exports
      - ./logs:/app/logs

    networks:
      - rackscrape

    command: npm run scrape

  # Optional: Service for exports
  rackscrape-export:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rackscrape-export
    profiles: ["export"]  # Only run when explicitly specified

    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/database/prices.db

    volumes:
      - ./database:/app/database
      - ./exports:/app/exports

    networks:
      - rackscrape

    command: npm run export

networks:
  rackscrape:
    driver: bridge
